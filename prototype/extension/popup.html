<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{font:14px system-ui;width:260px;padding:12px;line-height:1.5}button{padding:10px;width:100%;cursor:pointer}#status{white-space:pre-wrap}</style><b>리디 독서노트 수집</b><section id="shelf" hidden><p>가져올 책을 선택하세요.</p><label>옵시디언 보관함 <select id="vault" style="box-sizing:border-box;width:100%;padding:6px"></select></label><button id="add-vault" type="button">열린 보관함 연결</button><label><input id="all" type="checkbox"> 전체 선택</label><div id="books" style="max-height:260px;overflow:auto"></div><p><a id="export" aria-disabled="true">선택한 책을 옵시디언으로 보내기</a></p><p id="shelf-status"></p><hr></section><p>책별 독서노트 화면에서 모든 ‘더보기’를 누른 뒤 실행하세요.</p><label>연결 코드 (처음에만 입력)<input id="code" style="box-sizing:border-box;width:100%;padding:6px" placeholder="포트:연결 코드"></label><button id="go">옵시디언으로 보내기</button><button id="download">JSON으로 저장</button><p id="status"></p><script src="popup.js"></script></html>
