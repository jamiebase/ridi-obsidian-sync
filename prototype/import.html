<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>리디 독서노트 미리보기</title><style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:0 20px;color:#20252b;line-height:1.6}label{display:block;margin:18px 0}button{padding:10px 18px;margin:10px 8px 10px 0}pre{white-space:pre-wrap;background:#f3f5f7;padding:16px;max-height:480px;overflow:auto;border-radius:8px}#error{color:#a21b23}small{color:#555}</style></head><body><h1>리디 독서노트 가져오기</h1><p>한 권의 JSON과 대상 책 노트를 선택하세요. 원본 파일은 바꾸지 않습니다.</p><label>1. 리디 JSON <input id="json" type="file" accept=".json,application/json"></label><label>2. 책 노트 Markdown <input id="md" type="file" accept=".md,text/markdown,text/plain"></label><button id="preview">변경 내용 미리보기</button><button id="download" disabled>결과 Markdown 다운로드</button><p id="error" role="alert"></p><p id="summary"></p><pre id="result"></pre><small>이 프로토타입은 새 항목만 추가합니다. 리디에서 수정하거나 삭제한 항목은 기존 기록에 반영하지 않습니다.</small><script src="import.js"></script></body></html>
